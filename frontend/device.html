<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Devices (Class Wise)</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        .card {
            border-radius: 10px;
        }

        .card-body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }

        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #004085;
        }
    </style>
</head>

<body>
    <div class="container mt-2">
        <div id="deviceContainer" class="row gy-4">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const devices = [{
            class: "1",
            rfidReaderId: "01"
        }, {
            class: "2",
            rfidReaderId: "02"
        }, {
            class: "3",
            rfidReaderId: "03"
        }, {
            class: "4",
            rfidReaderId: "04"
        }, {
            class: "5",
            rfidReaderId: "05"
        }, {
            class: "6",
            rfidReaderId: "06"
        }, {
            class: "7",
            rfidReaderId: "07"
        }, {
            class: "8",
            rfidReaderId: "08"
        }, {
            class: "9",
            rfidReaderId: "09"
        }, {
            class: "10",
            rfidReaderId: "10"
        }, {
            class: "11",
            rfidReaderId: "11"
        }, {
            class: "12",
            rfidReaderId: "12"
        },];

        function renderDevices() {
            const container = document.getElementById('deviceContainer');
            container.innerHTML = '';

            devices.forEach(device => {
                const col = document.createElement('div');
                col.className = "col-12 col-md-6 col-lg-4";
                col.innerHTML = `
                    <div class="card h-100 shadow-sm">
                        <div class="card-body d-flex flex-column justify-content-between">
                            <h5 class="card-title mb-2">Class ${device.class}</h5>
                            <p class="mb-2"><strong>RFID Reader ID:</strong> ${device.rfidReaderId}</p>
                            <a href="#" class="btn btn-primary mt-auto" onclick="viewAttendance('${device.class}')">
    <i class="bi bi-eye"></i> View Attendance
</a>
                        </div>
                    </div>
                `;
                container.appendChild(col);
            });
        }

        renderDevices();
    </script>
    <script>function viewAttendance(className) {
            // Parent Window (index.html) को संदेश भेजें
            window.parent.postMessage({
                type: 'loadIframeWithParams',
                url: 'viewAttendance.html',
                params: `?class=${className}`
            }, '*');
        }
    </script>
</body>

</html>
