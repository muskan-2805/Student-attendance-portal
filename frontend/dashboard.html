<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Attendance</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <div class="col-12 bg-white">
        <main class="d-flex flex-column min-vh-100 p-4">
            <section>

                <div class="row text-center mb-4">
                    <div class="col-md-3 mb-3">
                        <div class="card border-success shadow">
                            <div class="card-body">
                                <h6 class="text-success">Present</h6>
                                <p id="presentCount" class="fs-4 fw-bold mb-0">0</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-3">
                        <div class="card border-danger shadow">
                            <div class="card-body">
                                <h6 class="text-danger">Absent</h6>
                                <p id="absentCount" class="fs-4 fw-bold mb-0">0</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-3">
                        <div class="card border-warning shadow">
                            <div class="card-body">
                                <h6 class="text-warning">Late</h6>
                                <p id="lateCount" class="fs-4 fw-bold mb-0">0</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-3">
                        <div class="card border-primary shadow">
                            <div class="card-body">
                                <h6 class="text-primary">Attendance %</h6>
                                <p id="attendancePercent" class="fs-4 fw-bold mb-0">0%</p>
                            </div>
                        </div>
                    </div>
                </div>
<div class="d-flex flex-column bg-white p-3 rounded shadow">
    <h3>📆 Daily Attendance Log</h3>

    <form id="filterForm" class="row g-3 align-items-end">
        <div class="col-md-2">
            <label for="filterClass" class="form-label">Class:</label>
            <input type="text" id="filterClass" class="form-control" placeholder="Enter Class">
        </div>
        <div class="col-md-2">
            <label for="filterSection" class="form-label">Section:</label>
            <input type="text" id="filterSection" class="form-control" placeholder="Enter Section">
        </div>
        <div class="col-md-2">
            <label for="filterStatus" class="form-label">Status:</label>
            <select id="filterStatus" class="form-select">
                <option value="">All</option>
                <option value="Present">Present</option>
                <option value="Absent">Absent</option>
                <option value="Late">Late</option>
            </select>
        </div>
        <div class="col-md-2">
            <label for="filterStartDate" class="form-label">Start Date:</label>
            <input type="date" id="filterStartDate" class="form-control">
        </div>
        <div class="col-md-2">
            <label for="filterEndDate" class="form-label">End Date:</label>
            <input type="date" id="filterEndDate" class="form-control">
        </div>
        <div class="col-md-2 d-flex gap-2">
            <button class="btn btn-outline-primary w-50" type="submit">Search</button>
            <button class="btn btn-outline-primary w-50" type="button" onclick="downloadCSV()">
                ⬇️ Export
            </button>
        </div>
    </form>
    
    <hr>
    <div class="my-4">
    <div class="table-responsive">
        <style>
            .table-fixed {
                table-layout: fixed;
                width: 100%;
            }

            .table-fixed th,
            .table-fixed td {
                word-wrap: break-word;
                overflow: hidden;
                text-overflow: ellipsis;
            }
        </style>
        <table class="table table-bordered table-hover table-fixed">
            <thead class="table-light">
                <tr>
                    <th style="width: 12%;">RFID Tag</th>
                    <th style="width: 12%;">Student/Staff ID</th>
                    <th style="width: 18%;">Name</th>
                    <th style="width: 10%;">Class</th>
                    <th style="width: 10%;">Section</th>
                    <th style="width: 12%;">Date</th>
                    <th style="width: 12%;">Status</th>
                    <th style="width: 14%;">Time</th>
                </tr>
            </thead>
            <tbody id="attendanceTable">
                <tr>
                    <td colspan="8" class="text-center text-muted">Loading attendance data...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let allAttendanceData = [];

        async function fetchAttendanceData(filters = {}) {
            try {
                const queryParams = new URLSearchParams(filters).toString();
                const response = await fetch(`http://localhost:5000/api/attendance?${queryParams}`);
                if (!response.ok) {
                    throw new Error('Failed to fetch attendance data');
                }
                allAttendanceData = await response.json();
                renderTable(allAttendanceData);
            } catch (error) {
                console.error("Error fetching attendance data:", error);
                document.getElementById("attendanceTable").innerHTML = `<tr><td colspan="8" class="text-center text-danger">Error loading data.</td></tr>`;
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById("attendanceTable");
            tbody.innerHTML = "";
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center text-muted">No records found</td></tr>`;
                updateSummary([]);
                return;
            }

            data.forEach(a => {
                const badgeClass = a.status === "Present" ? "success" : a.status === "Absent" ? "danger" : "warning text-dark";
                const date = new Date(a.timestamp);
                const formattedDate = date.toLocaleDateString();
                const formattedTime = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                tbody.innerHTML += `
                    <tr>
                        <td>${a.rfidTag || '--'}</td>
                        <td>${a.studentId || a.staffId || '--'}</td>
                        <td><i class="bi bi-person-circle"></i> ${a.studentName || '--'}</td>
                        <td>${a.class || '--'}</td>
                        <td>${a.section || '--'}</td>
                        <td>${formattedDate}</td>
                        <td><span class="badge bg-${badgeClass}">${a.status}</span></td>
                        <td>${formattedTime}</td>
                    </tr>
                `;
            });
            updateSummary(data);
        }

        function updateSummary(data) {
            const present = data.filter(a => a.status === "Present").length;
            const absent = data.filter(a => a.status === "Absent").length;
            const late = data.filter(a => a.status === "Late").length;
            const total = present + absent + late;
            document.getElementById("presentCount").innerText = present;
            document.getElementById("absentCount").innerText = absent;
            document.getElementById("lateCount").innerText = late;
            document.getElementById("attendancePercent").innerText = total ? ((present / total) * 100).toFixed(1) + "%" : "0%";
        }

        function downloadCSV() {
            let csv = "RFID Tag,Student/Staff ID,Name,Class,Section,Date,Status,Time\n";
            allAttendanceData.forEach(a => {
                const date = new Date(a.timestamp);
                const formattedDate = date.toLocaleDateString();
                const formattedTime = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                csv += `"${a.rfidTag || ''}","${a.studentId || a.staffId || ''}","${a.studentName || ''}","${a.class || ''}","${a.section || ''}","${formattedDate}","${a.status}","${formattedTime}"\n`;
            });
            const blob = new Blob([csv], { type: "text/csv" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "attendance_report.csv";
            link.click();
        }

        document.getElementById("filterForm").addEventListener("submit", function (e) {
            e.preventDefault();
            const filterClass = document.getElementById("filterClass").value;
            const filterSection = document.getElementById("filterSection").value;
            const filterStatus = document.getElementById("filterStatus").value;
            const filterStartDate = document.getElementById("filterStartDate").value;
            const filterEndDate = document.getElementById("filterEndDate").value;

            const filters = {};
            if (filterClass) filters.class = filterClass;
            if (filterSection) filters.section = filterSection;
            if (filterStatus) filters.status = filterStatus;
            if (filterStartDate) filters.startDate = filterStartDate;
            if (filterEndDate) filters.endDate = filterEndDate;

            fetchAttendanceData(filters);
        });

        // Initial load
        fetchAttendanceData();

        // Tell the parent to update the title
        if (window.parent) {
            window.parent.postMessage({
                type: 'updateTitle',
                title: 'Attendance Dashboard',
                showBack: false
            }, '*');
        }
    </script>
</body>
</html>
