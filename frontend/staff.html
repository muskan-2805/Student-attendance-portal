<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Staff List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        main {
            padding: 20px;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .table-container {
            flex: 1;
            overflow-y: auto;
        }

        table {
            width: 100%;
        }
    </style>
</head>

<body>
    <main class="container table-container">
        <table id="staffTable" class="table table-bordered table-hover align-middle shadow-sm">
            <thead class="table-dark text-center">
                <tr>
                    <th>S.No</th>
                    <th>Staff ID</th>
                    <th>Full Name</th>
                    <th>Job Title</th>
                    <th>Department</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="staffTableBody">
            </tbody>
        </table>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const staffTableBody = document.getElementById("staffTableBody");
        let allStaff = [];

        // Backend से सभी staff को fetch करें
        async function loadStaff() {
            try {
                const res = await fetch('http://localhost:5000/api/staff');
                const staffList = await res.json();
                allStaff = staffList;
                renderStaff(allStaff);
            } catch (error) {
                console.error('Error fetching staff:', error);
                staffTableBody.innerHTML = `<tr><td colspan="11" class="text-center text-danger">Failed to load staff data.</td></tr>`;
            }
        }

        // Staff को table में render करें
        function renderStaff(staffToDisplay) {
            staffTableBody.innerHTML = '';
            
            // Optional: Sort staff members
            staffToDisplay.sort((a, b) =>
                (a.department || "").localeCompare(b.department || "") ||
                (a.jobTitle || "").localeCompare(b.jobTitle || "")
            );

            if (staffToDisplay.length === 0) {
                staffTableBody.innerHTML = `<tr><td colspan="11" class="text-center text-muted">No staff members found.</td></tr>`;
                return;
            }

            staffToDisplay.forEach((staff, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="text-center">${index + 1}</td>
                    <td class="text-center">${staff.staffId || ""}</td>
                    <td>${staff.fullName || ""}</td>
                    <td>${staff.jobTitle || ""}</td>
                    <td>${staff.department || ""}</td>
                    <td>${staff.email || ""}</td>
                    <td>${staff.personalContact || ""}</td>
                    <td class="text-center">
                        <a href="staffDetails.html?id=${staff.staffId}" class="btn btn-sm btn-info text-white me-2">View</a>
                        <button onclick="editStaff('${staff.staffId}')" class="btn btn-sm btn-warning me-2">Edit</button>
                        <button onclick="deleteStaff('${staff.staffId}')" class="btn btn-sm btn-danger">Delete</button>
                    </td>
                `;
                staffTableBody.appendChild(tr);
            });
        }

        // Staff member को delete करें
        async function deleteStaff(staffId) {
            if (confirm('Are you sure you want to delete this staff member?')) {
                try {
                    const res = await fetch(`http://localhost:5000/api/staff/${staffId}`, {
                        method: 'DELETE',
                    });
                    if (res.ok) {
                        alert('Staff member deleted successfully!');
                        loadStaff(); // Reload the list
                    } else {
                        const error = await res.json();
                        alert('Failed to delete staff member: ' + error.msg);
                    }
                } catch (error) {
                    console.error('Deletion failed:', error);
                    alert('An error occurred. Please try again.');
                }
            }
        }

        // Edit button functionality
        function editStaff(staffId) {
            window.location.href = `addStaff.html?id=${staffId}&edit=1`;
        }
        
        // Filter logic (received from parent iframe)
        window.addEventListener('message', function(event) {
            const data = event.data;
            if (data.type === 'filterStaff') {
                const { searchStaffId, searchDepartment } = data;
                const filteredStaff = allStaff.filter(s =>
                    (searchStaffId === '' || (s.staffId || '').toLowerCase().includes(searchStaffId.toLowerCase())) &&
                    (searchDepartment === '' || (s.department || '').toLowerCase().includes(searchDepartment.toLowerCase()))
                );
                renderStaff(filteredStaff);
            } else if (data.type === 'resetStaff') {
                loadStaff();
            }
        });

        // Initial load
        document.addEventListener("DOMContentLoaded", loadStaff);
    </script>
</body>

</html>
