<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Staff List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            /* Added to prevent the entire page/body from scrolling */
            overflow: hidden; 
        }

        main {
            padding: 20px;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* * Important Fix: Changed .table-container to .table-responsive-wrapper 
         * and updated its max-height to ensure space for the header is calculated.
         * The scroll must happen on a parent element of the <table> itself.
         */
        .table-responsive-wrapper {
            flex: 1;
            /* 100% height minus the main padding (20px top + 20px bottom) */
            max-height: calc(100% - 40px); 
            overflow-y: auto;
        }

        table {
            width: 100%;
            /* Important: Removes bottom margin so table fits nicely inside the wrapper */
            margin-bottom: 0; 
        }
        
        /* Sticky header for the table */
        #staffTable thead th {
            position: sticky;
            top: 0;
            background-color: #212529;
            color: white;
            z-index: 10;
        }
    </style>
</head>

<body>
    <main class="container-fluid">
        <div class="table-responsive-wrapper">
            <table id="staffTable" class="table table-bordered table-hover align-middle shadow-sm">
                <thead class="table-dark text-center">
                    <tr>
                        <th>S.No</th>
                        <th>Staff ID</th>
                        <th>Full Name</th>
                        <th>Job Title</th>
                        <th>Department</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="staffTableBody">
                </tbody>
            </table>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const staffTableBody = document.getElementById("staffTableBody");
        let allStaff = [];

        // Backend से सभी staff को fetch करें
        async function loadStaff() {
            try {
                const res = await fetch('http://localhost:5000/api/staff');
                
                if (!res.ok) {
                    throw new Error(`HTTP error! status: ${res.status}`);
                }
                
                const staffList = await res.json();
                allStaff = staffList;
                renderStaff(allStaff);
            } catch (error) {
                console.error('Error fetching staff:', error);
                staffTableBody.innerHTML = `<tr><td colspan="8" class="text-center text-danger">Failed to load staff data. Please check server status.</td></tr>`;
            }
        }

        // Staff को table में render करें
        function renderStaff(staffToDisplay) {
            staffTableBody.innerHTML = '';

            // Optional: Sort staff members (your previous logic preserved)
            staffToDisplay.sort((a, b) =>
                (a.department || "").localeCompare(b.department || "") ||
                (a.jobTitle || "").localeCompare(b.jobTitle || "")
            );

            if (staffToDisplay.length === 0) {
                staffTableBody.innerHTML = `<tr><td colspan="8" class="text-center text-muted">No staff members found.</td></tr>`;
                return;
            }

            staffToDisplay.forEach((staff, index) => {
                // Determine which ID to use for actions (using _id or staffId for robustness)
                const uniqueId = staff.staffId || staff._id;
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="text-center">${index + 1}</td>
                    <td class="text-center">${staff.staffId || ""}</td>
                    <td>${staff.fullName || ""}</td>
                    <td>${staff.jobTitle || ""}</td>
                    <td>${staff.department || ""}</td>
                    <td>${staff.email || ""}</td>
                    <td>${staff.personalContact || ""}</td>
                    <td class="text-center">
                        <a href="#" onclick="viewStaffDetails('${uniqueId}')" class="btn btn-sm btn-info text-white me-2">View</a>
                        <button onclick="editStaff('${uniqueId}')" class="btn btn-sm btn-warning me-2">Edit</button>
                        <button onclick="deleteStaff('${uniqueId}')" class="btn btn-sm btn-danger">Delete</button>
                    </td>
                `;
                staffTableBody.appendChild(tr);
            });
        }
        
        // 🎯 NEW FUNCTION: Parent index.html को staffDetails.html लोड करने के लिए संदेश भेजें
        function viewStaffDetails(uniqueId) {
            window.parent.postMessage({
                type: 'loadIframeWithParams',
                url: 'staffDetails.html',
                params: `?id=${uniqueId}` // यह ID 'staffDetails.html' को भेजी जा रही है
            }, '*');
        }

        // Staff member को delete करें
        async function deleteStaff(staffId) {
            if (confirm('Are you sure you want to delete this staff member?')) {
                try {
                    const res = await fetch(`http://localhost:5000/api/staff/${staffId}`, {
                        method: 'DELETE',
                    });
                    if (res.ok) {
                        alert('Staff member deleted successfully!');
                        loadStaff(); // Reload the list
                    } else {
                        const error = await res.json();
                        alert('Failed to delete staff member: ' + (error.msg || 'Unknown error.'));
                    }
                } catch (error) {
                    console.error('Deletion failed:', error);
                    alert('An error occurred. Please try again.');
                }
            }
        }

        // Edit button functionality (Modified to use postMessage)
        function editStaff(staffId) {
            window.parent.postMessage({
                type: 'loadIframeWithParams',
                url: 'addStaff.html',
                params: `?id=${staffId}&edit=1` 
            }, '*');
        }
        
        // Filter logic (received from parent iframe)
        window.addEventListener('message', function(event) {
            if (!event.data || typeof event.data.type === 'undefined') return;

            const data = event.data;
            if (data.type === 'filterStaff') {
                const { searchStaffId, searchDepartment } = data;
                const filteredStaff = allStaff.filter(s =>
                    (searchStaffId === '' || (s.staffId || '').toLowerCase().includes(searchStaffId.toLowerCase())) &&
                    (searchDepartment === '' || (s.department || '').toLowerCase().includes(searchDepartment.toLowerCase()))
                );
                renderStaff(filteredStaff);
            } else if (data.type === 'resetStaff') {
                loadStaff();
            }
        });

        // Initial load
        document.addEventListener("DOMContentLoaded", loadStaff);
    </script>
</body>

</html>
