<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card p-4 shadow">
                    <h3 class="text-center mb-3">Forgot Password</h3>

                    <div id="emailSection">
                        <p class="text-center">Enter your email address to receive an OTP.</p>
                        <form id="forgotPasswordForm">
                            <div class="mb-3">
                                <input type="email" class="form-control" id="email" placeholder="Email" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Send OTP</button>
                        </form>
                    </div>

                    <div id="resetSection" style="display: none;">
                        <p class="text-center">Enter the OTP sent to your email and your new password.</p>
                        <form id="resetPasswordForm">
                            <div class="mb-3">
                                <input type="text" class="form-control" id="otp" placeholder="Enter OTP" required>
                            </div>
                            <div class="mb-3">
                                <input type="password" class="form-control" id="newPassword" placeholder="New Password" required>
                            </div>
                            <div class="mb-3">
                                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Reset Password</button>
                        </form>
                    </div>

                    <p class="text-center mt-3"><a href="login.html">Back to Login</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const emailSection = document.getElementById("emailSection");
        const resetSection = document.getElementById("resetSection");
        const forgotPasswordForm = document.getElementById("forgotPasswordForm");
        const resetPasswordForm = document.getElementById("resetPasswordForm");

        // Step 1: Handle sending the OTP
        forgotPasswordForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value;

            try {
                const res = await fetch("http://localhost:5000/api/auth/forgot-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email }),
                });

                const data = await res.json();

                if (res.ok) {
                    alert(data.msg);
                    emailSection.style.display = "none";
                    resetSection.style.display = "block";
                } else {
                    alert("Error: " + data.msg);
                }
            } catch (err) {
                console.error("Error:", err);
                alert("An error occurred. Please try again.");
            }
        });

        // Step 2: Handle OTP verification and password reset
        resetPasswordForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const otp = document.getElementById("otp").value;
            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (newPassword !== confirmPassword) {
                return alert("Passwords do not match.");
            }

            try {
                const res = await fetch("http://localhost:5000/api/auth/reset-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, otp, newPassword }),
                });

                const data = await res.json();

                if (res.ok) {
                    alert(data.msg);
                    window.location.href = "login.html"; // Redirect to login page
                } else {
                    alert("Error: " + data.msg);
                }
            } catch (err) {
                console.error("Error:", err);
                alert("An error occurred. Please try again.");
            }
        });
    </script>

</body>
</html>
