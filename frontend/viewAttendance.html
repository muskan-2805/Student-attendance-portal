<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>View Attendance</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .container {
            margin-top: 2rem;
        }

        .table-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <div class="container mt-2">
        <h2 id="classTitle" class="mb-3">Attendance</h2>
        <div class="table-container">
            <div class="table-responsive">
                <table class="table table-bordered table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>RFID Reader ID</th>
                            <th>Student/Staff ID</th>
                            <th>Name</th>
                            <th>Class</th>
                            <th>Section</th>
                            <th>Status</th>
                            <th>Date & Time</th>
                        </tr>
                    </thead>
                    <tbody id="attendanceTable">
                        <tr>
                            <td colspan="7" class="text-center text-muted">Loading attendance data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const selectedClass = urlParams.get('class');
            const classTitle = document.getElementById('classTitle');

            // Set the page title based on the class
            if (selectedClass) {
                classTitle.innerText = `Attendance - Class ${selectedClass}`;
            } else {
                classTitle.innerText = `All Attendance Logs`;
            }

            fetchAttendanceData(selectedClass);
        });

        async function fetchAttendanceData(className = '') {
            const tbody = document.getElementById("attendanceTable");
            tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted">Loading attendance data...</td></tr>`;

            let apiUrl = 'http://localhost:5000/api/attendance';
            if (className) {
                apiUrl += `?class=${className}`;
            }

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error('Failed to fetch attendance data');
                }
                
                const data = await response.json();
                renderTable(data);
            } catch (error) {
                console.error("Error fetching attendance data:", error);
                tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger">Error loading data. Please try again.</td></tr>`;
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById("attendanceTable");
            tbody.innerHTML = ""; // Clear the loading message

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted">No records found.</td></tr>`;
                return;
            }

            data.forEach(a => {
                const badgeClass = a.status === "Present" ? "success" : a.status === "Late" ? "warning text-dark" : "danger";
                const date = new Date(a.timestamp);
                const formattedDateTime = date.toLocaleString('en-GB');

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${a.rfidReaderId || '--'}</td>
                    <td>${a.studentId || a.staffId || '--'}</td>
                    <td>${a.studentName || '--'}</td>
                    <td>${a.class || '--'}</td>
                    <td>${a.section || '--'}</td>
                    <td><span class="badge bg-${badgeClass}">${a.status}</span></td>
                    <td>${formattedDateTime}</td>
                `;
                tbody.appendChild(row);
            });
        }
    </script>
</body>
</html>
