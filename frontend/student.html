<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Interface</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        main {
            padding: 20px;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .table-responsive {
            /* Max height adjusted for better layout inside iframe */
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }

        table {
            width: 100%;
        }

        /* Sticky header for the table */
        #studentTable thead th {
            position: sticky;
            top: 0;
            background-color: #212529;
            color: white;
            z-index: 10;
        }
    </style>
</head>

<body>
    <main class="container-fluid">
        <div class="table-responsive">
            <table id="studentTable" class="table table-bordered table-hover align-middle shadow-sm">
                <thead class="table-dark text-center">
                    <tr>
                        <th>Sno.</th>
                        <th>Student Name</th>
                        <th>Class</th>
                        <th>Section</th>
                        <th>Date of Birth</th>
                        <th>Contact</th>
                        <th>Address</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">
                    </tbody>
            </table>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const studentTableBody = document.getElementById('studentTableBody');
        let allStudents = [];

        // Sabhi students ko backend se fetch karein
        async function loadStudents() {
            try {
                // Ensure the path is correct
                const res = await fetch('http://localhost:5000/api/students'); 
                
                if (!res.ok) {
                    throw new Error(`HTTP error! status: ${res.status}`);
                }

                const students = await res.json();
                allStudents = students; // For filtering
                renderStudents(allStudents);
            } catch (error) {
                console.error('Error fetching students:', error);
                studentTableBody.innerHTML = '<tr><td colspan="8" class="text-center text-danger">Failed to load student data. Please check server status.</td></tr>';
            }
        }

        // Students ko table mein render karein
        function renderStudents(studentsToDisplay) {
            studentTableBody.innerHTML = '';
            if (studentsToDisplay.length === 0) {
                studentTableBody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">No students found.</td></tr>';
                return;
            }

            studentsToDisplay.forEach((student, index) => {
                // Determine which ID to use for actions (using _id for robustness)
                const uniqueId = student.studentId || student._id; 
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${student.name}</td>
                    <td>${student.class}</td>
                    <td>${student.section}</td>
                    <td>${student.dob || 'N/A'}</td>
                    <td>${student.contact || student.fatherMobile || 'N/A'}</td>
                    <td>${student.address || 'N/A'}</td>
                    <td class="text-center">
                        <a href="#" onclick="viewStudentDetails('${uniqueId}')" class="btn btn-sm btn-info text-white me-2">View</a>
                        <button onclick="editStudent('${uniqueId}')" class="btn btn-sm btn-primary me-2">Edit</button>
                        <button onclick="deleteStudent('${uniqueId}')" class="btn btn-sm btn-danger">Delete</button>
                    </td>
                `;
                studentTableBody.appendChild(tr);
            });
        }

        // 🎯 NEW FUNCTION: Parent index.html को studentDetails.html लोड करने के लिए संदेश भेजें
        function viewStudentDetails(uniqueId) {
            // 'studentDetails.html' को लोड करने के लिए parent (index.html) को सूचित करें
            window.parent.postMessage({
                type: 'loadIframeWithParams',
                url: 'studentDetails.html',
                params: `?id=${uniqueId}` // यह ID 'studentDetails.html' को भेजी जा रही है
            }, '*');
        }

        // Student ko delete karein
        async function deleteStudent(studentId) {
            if (confirm('Are you sure you want to delete this student?')) {
                try {
                    const res = await fetch(`http://localhost:5000/api/students/${studentId}`, {
                        method: 'DELETE',
                    });
                    if (res.ok) {
                        alert('Student deleted successfully!');
                        loadStudents();
                    } else {
                        const error = await res.json();
                        alert('Failed to delete student: ' + (error.msg || 'Unknown error.'));
                    }
                } catch (error) {
                    console.error('Deletion failed:', error);
                    alert('An error occurred. Please try again.');
                }
            }
        }

        // Edit button functionality
        function editStudent(studentId) {
            // Edit ke liye bhi postMessage ka upyog karna behtar hai
             window.parent.postMessage({
                type: 'loadIframeWithParams',
                url: 'addNewStudent.html',
                params: `?id=${studentId}&edit=1` 
            }, '*');
        }

        // Filtering logic (received from parent iframe)
        window.addEventListener('message', function(event) {
            // Safety check
            if (!event.data || typeof event.data.type === 'undefined') return;

            const data = event.data;
            if (data.type === 'filterStudents') {
                const { searchClass, searchSection } = data;
                const filteredStudents = allStudents.filter(s =>
                    (searchClass === '' || (s.class || '').toLowerCase() === (searchClass.toLowerCase())) &&
                    (searchSection === '' || (s.section || '').toLowerCase().includes(searchSection.toLowerCase()))
                );
                renderStudents(filteredStudents);
            } else if (data.type === 'resetStudents') {
                loadStudents();
            }
        });

        // Initial load
        document.addEventListener("DOMContentLoaded", loadStudents);
    </script>
</body>
</html>
