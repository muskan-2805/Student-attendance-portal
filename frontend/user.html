<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Profile</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <style>
    .nav-link.active {
      font-weight: bold;
      border-radius: 6px;
    }
  </style>
</head>

<body>
  <div class="container-fluid">
    <div class="row min-vh-100">
      <div class="col-12 p-0">
        <main class="d-flex flex-column h-100">

          <div class="container-fluid text-center mt-3">
            <div class="row justify-content-around flex-wrap">
              <div class="col-12 bg-light p-3">
                <img src="/frontend/flat-faces-icons-circle-man-6.png" class="rounded-circle" alt="Profile"
                     style="height: 150px; width: 150px;"><br>
              </div>

              <div class="col-12 bg-light p-3">
                <h6>Personal Information</h6>
                <form id="profileForm">
                  <fieldset disabled>
                    <div class="container-fluid">
                      <div class="row">
                        <div class="col">
                          <label for="userId" class="form-label">User ID</label>
                          <input id="userId" class="form-control" readonly>
                        </div>
                        <div class="col">
                          <label for="fullName" class="form-label">Full Name</label>
                          <input id="fullName" class="form-control">
                        </div>
                      </div>
                      <div class="row mt-2">
                        <div class="col">
                          <label for="dob" class="form-label">Date of Birth</label>
                          <input type="date" id="dob" class="form-control">
                        </div>
                        <div class="col">
                          <label for="gender" class="form-label">Gender</label>
                          <input id="gender" class="form-control">
                        </div>
                        <div class="col">
                          <label for="email" class="form-label">Email address</label>
                          <input type="email" id="email" class="form-control">
                        </div>
                        <div class="col">
                          <label for="contact" class="form-label">Contact Number</label>
                          <input id="contact" class="form-control" pattern="[0-9]{10}" maxlength="10"
                                 title="Enter a 10-digit phone number">
                        </div>
                      </div>
                    </div>
                  </fieldset>

                  <div class="mt-3">
                    <button class="btn btn-primary d-none" type="submit" id="submitBtn">Save Changes</button>
                  </div>

                  <div class="w-100 d-flex justify-content-end px-4 mt-3">
                    <button type="button" class="btn btn-outline-primary" data-bs-toggle="modal"
                            data-bs-target="#passwordModal">
                      Change Password
                    </button>
                    <button type="button" id="editBtn" onclick="toggleEditForm()"
                            class="btn btn-outline-primary ms-3">
                      Edit Profile
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>

          <!-- Password Modal -->
          <div class="modal fade" id="passwordModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <h1 class="modal-title fs-5">Change Password</h1>
                  <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                  <div class="form-group">
                    <label for="currentPassword">Current Password</label>
                    <input type="password" class="form-control" id="currentPassword">
                  </div>
                  <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" class="form-control" id="newPassword" minlength="6">
                  </div>
                  <div class="form-group mb-3">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" minlength="6">
                  </div>
                  <small class="text-muted">
                    Password must: 8+ chars, upper+lower, 1 number/symbol, match both fields.
                  </small>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                  <button type="button" class="btn btn-primary" id="savePasswordBtn">Save</button>
                </div>
              </div>
            </div>
          </div>

        </main>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // On page load -> user info populate
    document.addEventListener('DOMContentLoaded', () => {
      const user = JSON.parse(localStorage.getItem('user'));
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      document.getElementById('userId').value = user.id || '';
      document.getElementById('fullName').value = user.name || '';
      document.getElementById('email').value = user.email || '';
      document.getElementById('dob').value = user.dob ? user.dob.substring(0, 10) : '';
      document.getElementById('gender').value = user.gender || '';
      document.getElementById('contact').value = user.contact || '';
    });

    function toggleEditForm() {
      const fieldset = document.querySelector('#profileForm fieldset');
      const editBtn = document.getElementById('editBtn');
      const submitBtn = document.getElementById('submitBtn');
      const user = JSON.parse(localStorage.getItem('user'));

      if (fieldset.hasAttribute('disabled')) {
        fieldset.removeAttribute('disabled');
        editBtn.textContent = 'Cancel Edit';
        editBtn.classList.replace('btn-outline-primary', 'btn-outline-danger');
        submitBtn.classList.remove('d-none');
      } else {
        fieldset.setAttribute('disabled', true);
        editBtn.textContent = 'Edit Profile';
        editBtn.classList.replace('btn-outline-danger', 'btn-outline-primary');
        submitBtn.classList.add('d-none');

        // reset original values
        if (user) {
          document.getElementById('fullName').value = user.name || '';
          document.getElementById('email').value = user.email || '';
          document.getElementById('dob').value = user.dob ? user.dob.substring(0, 10) : '';
          document.getElementById('gender').value = user.gender || '';
          document.getElementById('contact').value = user.contact || '';
        }
      }
    }

    // Profile update submit
    document.getElementById('profileForm').addEventListener('submit', async (event) => {
      event.preventDefault();

      // Basic client-side validation before hitting the API 
      if (!event.target.checkValidity()) {
        event.target.reportValidity();
        return;
      }

      const userId = document.getElementById('userId').value;
      const fullName = document.getElementById('fullName').value;
      const dob = document.getElementById('dob').value;
      const gender = document.getElementById('gender').value;
      const email = document.getElementById('email').value;
      const contact = document.getElementById('contact').value;

      const token = localStorage.getItem('token');

      try {
        const response = await fetch(`${API_BASE_URL}/api/auth/update-profile`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-auth-token': token
          },
          body: JSON.stringify({ userId, name: fullName, dob, gender, email, contact }),
        });

        const result = await response.json();

        if (response.ok) {
          alert('Profile updated successfully!');
          localStorage.setItem('user', JSON.stringify(result.user));
          toggleEditForm();
        } else {
          alert('Error updating profile: ' + result.msg);
        }
      } catch (error) {
        console.error('Network error:', error);
        alert('Network error. Please try again.');
      }
    });

    // Password change
    document.getElementById('savePasswordBtn').addEventListener('click', async () => {
      const userId = document.getElementById('userId').value;
      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword !== confirmPassword) {
        alert('Passwords do not match!');
        return;
      }
      if (newPassword.length < 6) {
        alert('New password must be at least 6 characters long.');
        return;
      }

      const token = localStorage.getItem('token');

      try {
        const response = await fetch(`${API_BASE_URL}/api/auth/change-password`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-auth-token': token
          },
          body: JSON.stringify({ userId, currentPassword, newPassword }),
        });

        const result = await response.json();

        if (response.ok) {
          alert('Password changed successfully!');
          const modal = bootstrap.Modal.getInstance(document.getElementById('passwordModal'));
          modal.hide();
          document.getElementById('currentPassword').value = '';
          document.getElementById('newPassword').value = '';
          document.getElementById('confirmPassword').value = '';
        } else {
          alert('Error changing password: ' + result.msg);
        }
      } catch (error) {
        console.error('Network error:', error);
        alert('Network error. Please try again.');
      }
    });
  </script>
</body>
</html>
