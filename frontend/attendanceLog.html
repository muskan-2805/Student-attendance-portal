<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Attendance Logs</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
   <section class="p-3">
    <div class="card">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">Attendance</h5>
        </div>
        <div class="card-body">
            <form id="filterForm" class="row mb-3 align-items-center">
                <div class="col-md-2">
                    <input type="text" id="filterStudentId" class="form-control" placeholder="Student/Staff ID">
                </div>
                <div class="col-md-2">
                    <input type="text" id="filterDeviceId" class="form-control" placeholder="RFID Reader ID">
                </div>
                <div class="col-md-2">
                    <input type="text" id="filterClass" class="form-control" placeholder="Class">
                </div>
                <div class="col-md-2">
                    <input type="text" id="filterSection" class="form-control" placeholder="Section">
                </div>
                <div class="col-md-2">
                    <select id="filterStatus" class="form-select">
                        <option value="">All Status</option>
                        <option value="Present">Present</option>
                        <option value="Absent">Absent</option>
                        <option value="Late">Late</option>
                    </select>
                </div>
                <div class="col-md-2 text-end">
                    <button class="btn btn-primary" type="submit">Filter</button>
                </div>
            </form>

            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>S.No</th>
                            <th>Student/Staff ID</th>
                            <th>Student Name</th>
                            <th>RFID Reader ID</th>
                            <th>Class</th>
                            <th>Section</th>
                            <th>Status</th>
                            <th>Timestamp</th>
                        </tr>
                    </thead>
                    <tbody id="attendanceTableBody">
                        <tr>
                            <td colspan="8" class="text-center text-muted">Loading attendance data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>

    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetchAttendanceLogs();
            if (window.parent) {
                window.parent.postMessage({
                    type: 'updateTitle',
                    title: 'Attendance Logs',
                    showBack: true
                }, '*');
            }
        });

        document.getElementById('filterForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const filters = {
                studentId: document.getElementById('filterStudentId').value.trim(),
                rfidReaderId: document.getElementById('filterDeviceId').value.trim(),
                class: document.getElementById('filterClass').value.trim(),
                section: document.getElementById('filterSection').value.trim(),
                status: document.getElementById('filterStatus').value
            };

            Object.keys(filters).forEach(key => filters[key] === '' && delete filters[key]);
            
            fetchAttendanceLogs(filters);
        });

        async function fetchAttendanceLogs(filters = {}) {
            const tbody = document.getElementById('attendanceTableBody');
            tbody.innerHTML = `<tr><td colspan="8" class="text-center text-muted">Loading...</td></tr>`;
            try {
                const queryParams = new URLSearchParams(filters).toString();
                const response = await fetch(`${API_BASE_URL}/api/attendance?${queryParams}`);
                if (!response.ok) throw new Error('Failed to fetch attendance logs');
                
                const data = await response.json();
                renderTable(data);
            } catch (error) {
                console.error("Error fetching attendance logs:", error);
                tbody.innerHTML = `<tr><td colspan="8" class="text-center text-danger">Error loading data.</td></tr>`;
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('attendanceTableBody');
            tbody.innerHTML = '';
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center text-muted">No records found</td></tr>`;
                return;
            }

            data.forEach((item, index) => {
                const badgeClass = item.status === "Present" ? "success" : item.status === "Absent" ? "danger" : "warning text-dark";
                const date = new Date(item.timestamp);
                const formattedDateTime = date.toLocaleString('en-GB');

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${item.studentId || item.staffId || '--'}</td>
                    <td>${item.studentName || '--'}</td>
                    <td>${item.rfidReaderId || '--'}</td>
                    <td>${item.class || '--'}</td>
                    <td>${item.section || '--'}</td>
                    <td><span class="badge bg-${badgeClass}">${item.status}</span></td>
                    <td>${formattedDateTime}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>

</html>
